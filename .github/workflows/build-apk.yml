name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # JDK
      # =========================
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: npm install

      # =========================
      # Build Web App
      # =========================
      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # =========================
      # Add Android
      # =========================
      - name: Add Android platform
        run: npx cap add android

      # =========================
      # Android Storage Access
      # =========================
      - name: Setup Android storage access
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/pestco/app

          # -----------------------------------------
          # Add MANAGE_EXTERNAL_STORAGE permission
          # (kept as a fallback path; not required by
          # saveToDownloads on Android 10+ via MediaStore)
          # -----------------------------------------

          sed -i '/<application/i\
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' \
            android/app/src/main/AndroidManifest.xml

          # -----------------------------------------
          # Raise the Dalvik/ART heap ceiling — this app renders
          # PDF report pages via off-screen html2canvas + jsPDF,
          # which needs more headroom than the WebView's default
          # heap allows for large multi-month reports.
          # -----------------------------------------

          sed -i 's/<application/<application\n        android:largeHeap="true"/' \
            android/app/src/main/AndroidManifest.xml

          # -----------------------------------------
          # Create StorageAccessPlugin.java
          # -----------------------------------------

          cat > android/app/src/main/java/com/pestco/app/StorageAccessPlugin.java <<-'EOF'
          	package com.pestco.app;

          	import android.content.ContentResolver;
          	import android.content.ContentValues;
          	import android.content.Intent;
          	import android.net.Uri;
          	import android.os.Build;
          	import android.os.Environment;
          	import android.provider.MediaStore;
          	import android.provider.Settings;
          	import android.util.Base64;

          	import java.io.File;
          	import java.io.FileOutputStream;
          	import java.io.OutputStream;

          	import com.getcapacitor.JSObject;
          	import com.getcapacitor.Plugin;
          	import com.getcapacitor.PluginCall;
          	import com.getcapacitor.annotation.CapacitorPlugin;

          	@CapacitorPlugin(name = "StorageAccess")
          	public class StorageAccessPlugin extends Plugin {

          	    // ------------------------------------------------------------------
          	    // Writes a base64 file straight into the public Downloads folder.
          	    //
          	    // On Android 10+ (API 29+) this uses MediaStore, which lets an app
          	    // create new files in Downloads WITHOUT any storage permission at
          	    // all. No settings redirect, no permission dialog, fully silent.
          	    //
          	    // On Android 9 and older MediaStore.Downloads doesn't exist, so this
          	    // falls back to writing the file directly, which requires the legacy
          	    // WRITE_EXTERNAL_STORAGE runtime permission (requested from the JS
          	    // side before calling this).
          	    // ------------------------------------------------------------------
          	    @com.getcapacitor.PluginMethod
          	    public void saveToDownloads(PluginCall call) {
          	        String fileName = call.getString("fileName");
          	        String base64Data = call.getString("base64Data");
          	        String mimeType = call.getString("mimeType", "application/octet-stream");

          	        if (fileName == null || base64Data == null) {
          	            call.reject("fileName and base64Data are required");
          	            return;
          	        }

          	        byte[] bytes;
          	        try {
          	            bytes = Base64.decode(base64Data, Base64.DEFAULT);
          	        } catch (Exception e) {
          	            call.reject("Invalid base64Data", e);
          	            return;
          	        }

          	        try {
          	            String uriString;

          	            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
          	                ContentResolver resolver = getContext().getContentResolver();

          	                ContentValues values = new ContentValues();
          	                values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
          	                values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
          	                values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);

          	                Uri itemUri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
          	                if (itemUri == null) {
          	                    call.reject("Could not create file in Downloads");
          	                    return;
          	                }

          	                OutputStream out = resolver.openOutputStream(itemUri);
          	                if (out == null) {
          	                    call.reject("Could not open output stream for Downloads file");
          	                    return;
          	                }
          	                out.write(bytes);
          	                out.flush();
          	                out.close();

          	                uriString = itemUri.toString();

          	            } else {
          	                File downloadsDir = Environment.getExternalStoragePublicDirectory(
          	                    Environment.DIRECTORY_DOWNLOADS
          	                );
          	                if (!downloadsDir.exists()) {
          	                    downloadsDir.mkdirs();
          	                }

          	                File outFile = new File(downloadsDir, fileName);
          	                FileOutputStream fos = new FileOutputStream(outFile);
          	                fos.write(bytes);
          	                fos.flush();
          	                fos.close();

          	                uriString = Uri.fromFile(outFile).toString();
          	            }

          	            JSObject ret = new JSObject();
          	            ret.put("uri", uriString);
          	            call.resolve(ret);

          	        } catch (Exception e) {
          	            call.reject("Failed to save file to Downloads", e);
          	        }
          	    }

          	    // ------------------------------------------------------------------
          	    // Kept in case other parts of the app still check/request "All
          	    // files access" for other features. Not needed for saveToDownloads.
          	    // ------------------------------------------------------------------
          	    @com.getcapacitor.PluginMethod
          	    public void checkAllFilesAccess(PluginCall call) {
          	        boolean granted;

          	        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
          	            granted = Environment.isExternalStorageManager();
          	        } else {
          	            granted = true;
          	        }

          	        JSObject ret = new JSObject();
          	        ret.put("granted", granted);
          	        call.resolve(ret);
          	    }

          	    @com.getcapacitor.PluginMethod
          	    public void requestAllFilesAccess(PluginCall call) {
          	        try {
          	            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
          	                Intent intent = new Intent(
          	                    Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION
          	                );
          	                intent.setData(Uri.parse("package:" + getContext().getPackageName()));
          	                getActivity().startActivity(intent);
          	            }
          	            call.resolve();
          	        } catch (Exception e) {
          	            try {
          	                Intent intent = new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
          	                getActivity().startActivity(intent);
          	                call.resolve();
          	            } catch (Exception e2) {
          	                call.reject("Unable to open storage access settings", e2);
          	            }
          	        }
          	    }
          	}
          	EOF

          # -----------------------------------------
          # Register plugin in MainActivity
          # -----------------------------------------

          cat > android/app/src/main/java/com/pestco/app/MainActivity.java <<-'EOF'
          	package com.pestco.app;

          	import android.os.Bundle;

          	import com.getcapacitor.BridgeActivity;

          	public class MainActivity extends BridgeActivity {

          	    @Override
          	    public void onCreate(Bundle savedInstanceState) {
          	        registerPlugin(StorageAccessPlugin.class);
          	        super.onCreate(savedInstanceState);
          	    }
          	}
          	EOF

          echo "======================================"
          echo "Android storage access setup complete"
          echo "======================================"

      # =========================
      # Generate Icons
      # =========================
      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android

      # =========================
      # Capacitor Sync
      # =========================
      - name: Sync Capacitor
        run: npx cap sync android

      # =========================
      # Verify Storage Permission
      # =========================
      - name: Verify Android storage setup
        run: |
          echo "===== MANIFEST ====="
          grep -n "MANAGE_EXTERNAL_STORAGE" \
            android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "===== STORAGE PLUGIN ====="
          test -f \
            android/app/src/main/java/com/pestco/app/StorageAccessPlugin.java \
            && echo "StorageAccessPlugin.java OK" \
            || echo "StorageAccessPlugin.java MISSING"

          echo ""
          echo "===== MAIN ACTIVITY ====="
          cat android/app/src/main/java/com/pestco/app/MainActivity.java

      # =========================
      # Gradle permission
      # =========================
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # =========================
      # Build APK
      # =========================
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # =========================
      # Upload APK
      # =========================
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pestco-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # =========================
      # GitHub Release
      # =========================
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
