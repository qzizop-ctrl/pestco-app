name: Sync package-lock.json

# One-off manual fix for when package.json and package-lock.json drift out
# of sync (e.g. a dependency was added to package.json without running
# `npm install` locally afterwards). Trigger it from the Actions tab (or the
# GitHub mobile app: repo -> Actions -> "Sync package-lock.json" -> Run
# workflow) whenever that happens again — no local terminal needed.
#
# It runs `npm install` (which updates package-lock.json to match
# package.json) and commits the result straight to the branch you pick.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install (updates package-lock.json)
        run: npm install

      - name: Commit updated lock file
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock.json with package.json"
          git push origin HEAD:${{ inputs.branch }}
