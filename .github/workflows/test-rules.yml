name: Firestore rules tests

# Runs the security-rules tests (tests/rules) against the Firestore emulator
# whenever the rules or those tests change. Kept out of the release workflows
# on purpose: it needs Java + the Firebase CLI, which the app builds don't.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/firestore.rules"
      - "tests/rules/**"
      - "firebase.json"
      - ".github/workflows/test-rules.yml"
  push:
    branches: [main]
    paths:
      - "src/firestore.rules"
      - "tests/rules/**"
      - "firebase.json"
      - ".github/workflows/test-rules.yml"

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # Not in package.json on purpose (see tests/rules/README.md).
      - name: Install rules-test tooling
        run: npm install --no-save @firebase/rules-unit-testing@^3 firebase-tools

      - name: Run rules tests
        run: npm run test:rules
