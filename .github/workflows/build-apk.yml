name: Build Android APK

# When this runs:
#   - every push to main: build + test, and keep the APK as a (private)
#     workflow artifact. NOT published anywhere.
#   - push a tag like  android-v1.2.0   -> also publishes a GitHub Release.
#   - "Run workflow" with a version filled in -> same as pushing that tag.
# (Before, EVERY push to main published a public release: release spam, and
# the app was downloadable by anyone if the repository is public.)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a GitHub Release with this version (e.g. 1.2.0). Leave empty to only build."
        required: false
        type: string
  push:
    branches: [main]
    tags: ["android-v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 != '' }}

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # =========================
      # JDK
      # =========================
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # Release version (empty = build only)
      # =========================
      - name: Work out release version
        id: meta
        shell: bash
        run: |
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            VERSION="${GITHUB_REF_NAME#android-v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          fi
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3 (got '$VERSION')"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      # =========================
      # Install dependencies
      # =========================
      # npm ci = exactly what package-lock.json says (and it checks the
      # integrity hash of the xlsx tarball recorded there), instead of
      # `npm install`, which may quietly resolve newer versions.
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      # =========================
      # Lint
      # =========================
      - name: Run lint
        run: npm run lint

      # =========================
      # Run tests
      # =========================
      - name: Run tests
        run: npm run test

      # =========================
      # Build Web App
      # =========================
      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # =========================
      # Add Android
      # =========================
      - name: Add Android platform
        run: npx cap add android

      # =========================
      # Android Storage Access
      # =========================
      - name: Setup Android storage access
        run: npm run android:patch

      # =========================
      # Generate Icons
      # =========================
      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android

      # =========================
      # Capacitor Sync
      # =========================
      - name: Sync Capacitor
        run: npx cap sync android

      # =========================
      # Release keystore
      # =========================
      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: echo "$ANDROID_RELEASE_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}

      # =========================
      # Gradle permission
      # =========================
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # =========================
      # Build APK
      # =========================
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      # =========================
      # Keep the APK (private, 14 days)
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pest-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # =========================
      # GitHub Release (tags / manual version only)
      # =========================
      - name: Create GitHub Release with APK
        if: ${{ steps.meta.outputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android-v${{ steps.meta.outputs.version }}"
          name: "Android v${{ steps.meta.outputs.version }}"
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
