name: Build Windows Desktop App

# When this runs:
#   - every push to main: build + test, installer kept as a (private)
#     workflow artifact. NOT published.
#   - push a tag like  win-v1.2.0   -> builds AND publishes a GitHub Release
#     v1.2.0 with the installer + latest.yml (what the in-app auto-updater
#     reads).
#   - "Run workflow" with a version filled in -> same as pushing that tag.
#
# The version in package.json used to stay 1.0.0 forever, so installed apps
# could never see a "newer" release and auto-update never triggered (and the
# separate softprops release below, tagged win-v1.0.N, carried no
# latest.yml). The version is now taken from the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a GitHub Release with this version (e.g. 1.2.0). Leave empty to only build."
        required: false
        type: string
  push:
    branches: [main]
    tags: ["win-v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      # =========================
      # Release version (empty = build only)
      # =========================
      - name: Work out release version
        id: meta
        shell: bash
        run: |
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/win-v* ]]; then
            VERSION="${GITHUB_REF_NAME#win-v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          fi
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3 (got '$VERSION')"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      # =========================
      # Install dependencies
      # =========================
      # `npm ci` — see the note in build-apk.yml.
      #
      # electron's postinstall step downloads a large prebuilt binary
      # straight from GitHub releases (outside npm's own registry, so
      # npm's registry-level retry logic doesn't cover it), which is what
      # actually failed here (ECONNRESET) rather than anything about this
      # repo's code — a transient runner network blip mid-download, not a
      # reproducible error. npm_config_fetch_retries covers registry
      # installs; wrapping the whole step in a retry action is what
      # actually covers the electron binary download, since that request
      # is unaffected by the npm config. Three attempts, a fixed pause
      # between them so a same-minute network hiccup doesn't repeat.
      - name: Install dependencies
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      # =========================
      # Lint
      # =========================
      # Blocking, same as the tests step below: `npm run lint` was defined
      # in package.json but never actually wired into either workflow, so
      # style/correctness issues it would catch (unused vars, hook-deps
      # mistakes, etc.) could merge to main unnoticed. Runs before tests so
      # a lint failure is reported first/fastest.
      - name: Run lint
        run: npm run lint

      # =========================
      # Stamp the release version (before the web build so the app itself
      # reports it, and before packaging so latest.yml carries it)
      # =========================
      - name: Set package version
        if: ${{ steps.meta.outputs.version != '' }}
        shell: bash
        run: npm pkg set version="${{ steps.meta.outputs.version }}"

      # =========================
      # Run tests
      # =========================
      # Blocking on purpose: this covers the business-logic tests
      # (permissions, dashboard calculations, etc.) — a red test here
      # means the build below would ship a real regression, not just a
      # style nit, so it should stop the release.
      - name: Run tests
        run: npm run test

      # =========================
      # Build Web App & Electron
      # =========================
      - name: Build Web App and Electron
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # =========================
      # Code signing (Azure Trusted Signing, or a .pfx, only if the secrets exist)
      # =========================
      # Passing `CSC_LINK: ${{ secrets.WIN_CSC_LINK }}` straight into the
      # packaging step defines CSC_LINK as an EMPTY string when the secret is
      # missing, and electron-builder then fails with "Env WIN_CSC_LINK is not
      # correct, cannot resolve ... not a file". So the variables are only
      # exported when the secret has a value; otherwise the build simply
      # isn't signed (as before).
      - name: Configure code signing
        shell: bash
        run: |
          # 1) Azure Trusted Signing — preferred. Certificates for new
          #    OV/EV code-signing since 2023 live on hardware tokens/HSMs, so a
          #    downloadable .pfx (option 2) is no longer something most
          #    publishers can get; Azure signs remotely and needs no file.
          #    All seven values must be present or this path is skipped.
          if [[ -n "$AZURE_TENANT_ID" && -n "$AZURE_CLIENT_ID" && -n "$AZURE_CLIENT_SECRET" \
                && -n "$AZURE_SIGN_ENDPOINT" && -n "$AZURE_SIGN_ACCOUNT" \
                && -n "$AZURE_SIGN_PROFILE" && -n "$AZURE_SIGN_PUBLISHER" ]]; then
            {
              echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
              echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
              echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
              echo "SIGNING=azure"
            } >> "$GITHUB_ENV"
            # electron-builder reads win.azureSignOptions from package.json
            # (only on this runner, same trick as "Set package version").
            npm pkg set \
              "build.win.azureSignOptions.publisherName=$AZURE_SIGN_PUBLISHER" \
              "build.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT" \
              "build.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT" \
              "build.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE"
            echo "Code signing enabled: Azure Trusted Signing."

          # 2) A .pfx certificate (base64 in WIN_CSC_LINK), as before.
          elif [[ -n "$CERT_B64" ]]; then
            echo "CSC_LINK=$(printf %s "$CERT_B64" | tr -d '\r\n')" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING=pfx" >> "$GITHUB_ENV"
            echo "Code signing enabled: .pfx certificate."

          # 3) Nothing configured: build unsigned, but say so loudly.
          else
            echo "SIGNING=none" >> "$GITHUB_ENV"
            echo "::warning title=Unsigned installer::No code-signing secrets are set, so this installer is UNSIGNED and Windows SmartScreen will warn on install. See docs/code-signing.md."
          fi
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
          CERT_B64: ${{ secrets.WIN_CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # =========================
      # Package Windows App
      # =========================
      # Without a version: build the installer only (nothing is published).
      # With a version: --publish always is what electron.js's
      # initAutoUpdate() needs — electron-builder creates the GitHub Release
      # (tag v<version>, published rather than draft: see package.json >
      # build.publish.releaseType) and uploads latest.yml next to the
      # installer; that file is what autoUpdater reads to learn a newer
      # version exists.
      #
      # Code signing is optional (see "Configure code signing" above and
      # docs/code-signing.md): with Azure Trusted Signing or .pfx secrets set,
      # electron-builder signs the installer automatically. Unsigned builds
      # work but Windows SmartScreen warns on install, and updates can't be
      # tied to a publisher.
      - name: Package Windows App (build only)
        if: ${{ steps.meta.outputs.version == '' }}
        run: npx electron-builder --win --publish never

      - name: Package and publish Windows App
        if: ${{ steps.meta.outputs.version != '' }}
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # Verify the signature (only when signing was configured)
      # =========================
      # If signing was configured but the installer came out unsigned or
      # invalid, fail the job instead of letting it pass quietly. NOTE: with a
      # version set, electron-builder has already published by this point, so
      # for a release this is an alarm, not a gate — check it before announcing.
      - name: Verify installer signature
        if: ${{ env.SIGNING != 'none' }}
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "$($_.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad = $true }
          }
          if ($bad) { throw "Installer is not validly signed." }

      # =========================
      # Keep the installer (private, 14 days)
      # =========================
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pest-windows-installer
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 14
