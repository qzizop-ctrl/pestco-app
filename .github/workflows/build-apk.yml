      - name: Setup Android storage access
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- Manifest ----------
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />'

          if permission not in text:
              text = text.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          manifest.write_text(text)

          # ---------- StorageAccessPlugin ----------
          plugin = Path(
              "android/app/src/main/java/com/pestco/app/StorageAccessPlugin.java"
          )

          plugin.parent.mkdir(parents=True, exist_ok=True)

          plugin.write_text(r'''package com.pestco.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "StorageAccess")
          public class StorageAccessPlugin extends Plugin {

              @PluginMethod
              public void checkAllFilesAccess(PluginCall call) {
                  boolean granted;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      granted = Environment.isExternalStorageManager();
                  } else {
                      granted = true;
                  }

                  call.resolve(
                      new com.getcapacitor.JSObject()
                          .put("granted", granted)
                  );
              }

              @PluginMethod
              public void requestAllFilesAccess(PluginCall call) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION
                          );

                          intent.setData(
                              Uri.parse("package:" + getContext().getPackageName())
                          );

                          getActivity().startActivity(intent);
                      }

                      call.resolve();
                  } catch (Exception e) {
                      try {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION
                          );

                          getActivity().startActivity(intent);
                          call.resolve();
                      } catch (Exception e2) {
                          call.reject(
                              "Unable to open storage access settings",
                              e2
                          );
                      }
                  }
              }
          }
          ''')

          # ---------- MainActivity registration ----------
          activity = Path(
              "android/app/src/main/java/com/pestco/app/MainActivity.java"
          )

          text = activity.read_text()

          if "StorageAccessPlugin" not in text:
              text = text.replace(
                  "package com.pestco.app;",
                  """package com.pestco.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;"""
              )

              text = text.replace(
                  "public class MainActivity extends BridgeActivity {",
                  """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(StorageAccessPlugin.class);
              }"""
              )

          activity.write_text(text)

          print("Android storage access setup complete.")
          PY
