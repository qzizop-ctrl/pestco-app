name: Tests & Lint

# Runs the app's unit tests (Vitest) and ESLint on every push to main and
# every pull request. Separate from test-rules.yml (Firestore emulator
# tests, needs Java) and the build-* workflows (needs Android SDK / Windows
# signing) — this one is fast and has no extra system deps, so it should run
# on every change, not just when specific paths are touched.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # `--ignore-scripts` blocks dependency lifecycle scripts (supply-chain
      # hardening). This repo's own postinstall (xlsx integrity check) is
      # therefore run explicitly in the next step.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify xlsx integrity
        run: npm run xlsx:verify

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
