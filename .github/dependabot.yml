version: 2
updates:
  # npm packages (react, firebase, electron, capacitor, dev tooling...).
  # xlsx is installed from a direct CDN .tgz URL rather than the npm
  # registry (see package.json), so Dependabot can't version-check it —
  # that one has to be updated manually by watching
  # https://cdn.sheetjs.com/ or https://git.sheetjs.com/sheetjs/sheetjs
  # for new releases.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch same-vendor packages into one PR instead of one PR per
      # package, so a Capacitor or Sentry bump doesn't spam ten PRs.
      capacitor:
        patterns:
          - "@capacitor/*"
      sentry:
        patterns:
          - "@sentry/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
    ignore:
      # Only patch-level updates (1.2.3 -> 1.2.4) go through
      # automatically now. Both major AND minor are blocked, because
      # minor alone already broke something once: lucide-react went
      # 0.383.0 -> 0.577.0 as a "minor" bump (its major is still 0, so
      # semver formally allows that), and pre-1.0 packages routinely
      # rename/remove things across "minor" versions the same way a real
      # major bump would. Dependabot won't propose major or minor bumps
      # for anything now — check release notes by hand and upgrade
      # deliberately when there's a real reason to.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # The GitHub Actions used in .github/workflows/ (actions/checkout,
  # actions/setup-node, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Same patch-only policy as the npm block above.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
