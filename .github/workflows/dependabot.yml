version: 2
updates:
  # npm packages (react, firebase, electron, capacitor, dev tooling...).
  # xlsx is installed from a direct CDN .tgz URL rather than the npm
  # registry (see package.json), so Dependabot can't version-check it —
  # that one has to be updated manually by watching
  # https://cdn.sheetjs.com/ or https://git.sheetjs.com/sheetjs/sheetjs
  # for new releases.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch same-vendor packages into one PR instead of one PR per
      # package, so a Capacitor or Sentry bump doesn't spam ten PRs.
      capacitor:
        patterns:
          - "@capacitor/*"
      sentry:
        patterns:
          - "@sentry/*"

  # The GitHub Actions used in .github/workflows/ (actions/checkout,
  # actions/setup-node, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
