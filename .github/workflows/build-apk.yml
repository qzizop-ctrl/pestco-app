name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # JDK
      # =========================
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: npm install

      # =========================
      # Run tests
      # =========================
      # Blocking on purpose: this covers the business-logic tests
      # (permissions, dashboard calculations, etc.) — a red test here
      # means the build below would ship a real regression, not just a
      # style nit, so it should stop the release.
      - name: Run tests
        run: npm run test

      # =========================
      # Build Web App
      # =========================
      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # =========================
      # Add Android
      # =========================
      - name: Add Android platform
        run: npx cap add android

      # =========================
      # Android Storage Access
      # =========================
      # Uses the same script as local dev (`npm run android:patch`) instead
      # of duplicating the manifest/plugin patching inline here — see
      # scripts/patch-android-storage.cjs.
      - name: Setup Android storage access
        run: npm run android:patch

      # =========================
      # Generate Icons
      # =========================
      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android

      # =========================
      # Capacitor Sync
      # =========================
      - name: Sync Capacitor
        run: npx cap sync android

      # =========================
      # Gradle permission
      # =========================
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # =========================
      # Build APK
      # =========================
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # =========================
      # Stage APK for Firebase Hosting
      # =========================
      # Copies the APK to hosting-download/pest-latest.apk — a fixed
      # filename/URL that never changes across releases. See
      # scripts/publish-apk-hosting.cjs and the README section on forcing
      # old clients to update. This only copies the file locally in the
      # runner; the next step actually deploys it.
      - name: Stage APK for hosting
        run: npm run apk:stage

      # =========================
      # Strip executable bit
      # =========================
      # Firebase Hosting's free Spark plan rejects any file with the
      # executable permission bit set ("Executable files are forbidden
      # on the Spark billing plan"). Force every file in the folder we
      # deploy to be non-executable, regardless of what permissions the
      # build tools left on it.
      - name: Strip executable bit from hosting files
        run: chmod -R a-x hosting-download

      # =========================
      # Deploy to Firebase Hosting
      # =========================
      # Publishes hosting-download/ (just the APK + its landing page) to
      # the fixed URL that config/appVersion.updateUrl points to in
      # Firestore. Needs two repo secrets:
      #   - FIREBASE_SERVICE_ACCOUNT: a Firebase service account JSON key
      #     (Firebase Console → Project settings → Service accounts →
      #     Generate new private key), pasted in as-is.
      #   - FIREBASE_PROJECT_ID: the Firebase project ID (same one `firebase
      #     use --add` picks locally).
      # channelId is explicit ("live") so this always deploys for real,
      # not to a temporary preview channel — this action's default channel
      # choice depends on the GitHub event, which we don't want to rely on
      # here.
      - name: Deploy APK to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: pestco-app
          channelId: live

      # =========================
      # GitHub Release
      # =========================
      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
