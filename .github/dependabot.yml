version: 2
updates:
  # npm packages (react, firebase, electron, capacitor, dev tooling...).
  # xlsx is installed from a direct CDN .tgz URL rather than the npm
  # registry (see package.json), so Dependabot can't version-check it —
  # that one has to be updated manually by watching
  # https://cdn.sheetjs.com/ or https://git.sheetjs.com/sheetjs/sheetjs
  # for new releases.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch same-vendor packages into one PR instead of one PR per
      # package, so a Capacitor or Sentry bump doesn't spam ten PRs.
      capacitor:
        patterns:
          - "@capacitor/*"
      sentry:
        patterns:
          - "@sentry/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
    ignore:
      # Auto-merge-worthy minor/patch updates keep coming through as
      # normal — this only blocks *major* version bumps for every
      # package, since those are the ones that broke npm install twice
      # already (vite 5→8, eslint 9→10) and can just as easily break the
      # app itself at runtime (react 18→19, tailwindcss 3→4, electron
      # 31→44 are all in the open PRs right now). Dependabot simply won't
      # propose major bumps anymore — check each package's own release
      # notes by hand every so often instead, and upgrade deliberately
      # when there's a real reason to.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The GitHub Actions used in .github/workflows/ (actions/checkout,
  # actions/setup-node, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Same reasoning as the npm block above: a major-version bump here
      # (actions/checkout, actions/setup-node, actions/setup-java,
      # softprops/action-gh-release all jumped several majors at once
      # when this wasn't in place) can silently change workflow behavior.
      # Minor/patch still auto-updates; majors need a manual look first.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
