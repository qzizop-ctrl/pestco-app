name: Sync package-lock.json

# One-off manual fix for when package.json and package-lock.json drift out
# of sync. Trigger it from the Actions tab (or the GitHub mobile app:
# repo -> Actions -> "Sync package-lock.json" -> Run workflow).
#
# It runs `npm install` (which updates package-lock.json to match
# package.json) and commits the result straight to the branch you pick.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update"
        required: false
        default: "main"
        type: string
      fresh:
        description: "Regenerate the lock file from scratch (delete it first)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # For big upgrades (several majors at once, e.g. Vite 5 -> 8 together
      # with Vitest 2 -> 4). Resolving from nothing has no stale constraints.
      - name: Start from scratch (only when "fresh" is ticked)
        if: ${{ inputs.fresh }}
        run: rm -f package-lock.json

      # Newer npm fixes an arborist crash ("Cannot read properties of null
      # (reading 'edgesOut')") that --package-lock-only can hit. Pinned to an
      # exact version so the tool itself is reproducible.
      - name: Upgrade npm
        run: npm install -g --ignore-scripts npm@12.0.1

      # Resolving dependencies is the whole purpose of this workflow, so this
      # step cannot use a locked install (`npm ci`).
      - name: Install (updates package-lock.json)
        # --allow-remote=root: npm 12 blocks URL dependencies by default; this
        # allows only the project's own direct ones (xlsx from cdn.sheetjs.com).
        run: npm install --ignore-scripts --allow-remote=root

      - name: Commit updated lock file
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock.json with package.json"
          git push origin "HEAD:${BRANCH}"
