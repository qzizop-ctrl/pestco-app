name: Firestore rules tests

# Runs the security-rules tests (tests/rules) against the Firestore emulator
# whenever the rules or those tests change. Kept out of the release workflows
# on purpose: it needs Java + the Firebase CLI, which the app builds don't.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/firestore.rules"
      - "tests/rules/**"
      - "firebase.json"
      - ".github/workflows/test-rules.yml"
  push:
    branches: [main]
    paths:
      - "src/firestore.rules"
      - "tests/rules/**"
      - "firebase.json"
      - ".github/workflows/test-rules.yml"

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # `npm ci` — see the note in build-apk.yml.
      # `--ignore-scripts` blocks dependency lifecycle scripts (supply-chain
      # hardening). This repo's own postinstall (xlsx integrity check) is
      # therefore run explicitly in the next step.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify xlsx integrity
        run: npm run xlsx:verify

      # Not in package.json on purpose (see tests/rules/README.md).
      # Exact versions (no ^ / latest) so every run installs the same tooling;
      # bump them deliberately here and in tests/rules/README.md + README.md.
      - name: Install rules-test tooling
        run: npm install --no-save --ignore-scripts @firebase/rules-unit-testing@5.0.1 firebase-tools@13.35.1

      - name: Run rules tests
        run: npm run test:rules
