name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 != '' }}

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # =========================
      # JDK
      # =========================
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm install
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      # =========================
      # Lint
      # =========================
      - name: Run lint
        run: npm run lint

      # =========================
      # Run tests
      # =========================
      - name: Run tests
        run: npm run test

      # =========================
      # Build Web App
      # =========================
      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # =========================
      # Add Android
      # =========================
      - name: Add Android platform
        run: npx cap add android

      # =========================
      # Android Storage Access
      # =========================
      - name: Setup Android storage access
        run: npm run android:patch

      # =========================
      # Generate Icons
      # =========================
      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android

      # =========================
      # Capacitor Sync
      # =========================
      - name: Sync Capacitor
        run: npx cap sync android

      # =========================
      # DEBUG: check keystore secret length (temporary)
      # =========================
      - name: DEBUG check keystore secret length
        run: |
          echo "Length of secret: ${#ANDROID_RELEASE_KEYSTORE_B64}"
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}

      # =========================
      # Release keystore
      # =========================
      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: echo "$ANDROID_RELEASE_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}

      # =========================
      # Gradle permission
      # =========================
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # =========================
      # Build APK
      # =========================
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      # =========================
      # GitHub Release
      # =========================
      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
