name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: npm install

      # =========================
      # Run tests
      # =========================
      # Blocking on purpose: this covers the business-logic tests
      # (permissions, dashboard calculations, etc.) — a red test here
      # means the build below would ship a real regression, not just a
      # style nit, so it should stop the release.
      - name: Run tests
        run: npm run test

      # =========================
      # Build Web App & Electron
      # =========================
      - name: Build Web App and Electron
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # =========================
      # Package Windows App
      # =========================
      # --publish always is what electron.js's initAutoUpdate() comment
      # already says this needs: electron-builder itself creates/updates a
      # GitHub Release (tagged v<package.json version>, standard behavior
      # for the "github" publish provider already configured in
      # package.json's "build" block) AND uploads latest.yml alongside the
      # installer — that file is what autoUpdater.checkForUpdatesAndNotify()
      # actually reads to know a newer version exists. Previously this was
      # `--publish never`, which built the installer but never produced
      # latest.yml at all, so every already-installed Windows client's
      # update check was silently failing (caught by the .on('error')
      # handler, logged to console, never shown to the user).
      # GH_TOKEN is electron-builder's expected env var name for this
      # (falls back to GITHUB_TOKEN too); the default Actions token already
      # has the "contents: write" permission this workflow declares above.
      - name: Package Windows App (Electron Builder)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # GitHub Release for Windows
      # =========================
      # Left as-is on purpose — this still creates its own separate
      # release (tag "win-v1.0.<run number>") alongside the one
      # electron-builder now also creates above (tag "v<package.json
      # version>"). That's redundant (two releases per push with the same
      # .exe) but harmless — different tags, no overwrite, nothing reads
      # this one for auto-update. Not touched here to keep this fix
      # minimal; worth deciding later whether to drop this step now that
      # electron-builder's own release covers the same need.
      - name: Create GitHub Release with Windows App
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "win-v1.0.${{ github.run_number }}"
          name: "Windows Release v1.0.${{ github.run_number }}"
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
