name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # JDK
      # =========================
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: npm install

      # =========================
      # Build Web App
      # =========================
      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # =========================
      # Add Android
      # =========================
      - name: Add Android platform
        run: npx cap add android

      # =========================
      # Android Storage Access
      # =========================
      - name: Setup Android storage access
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/pestco/app

          # -----------------------------------------
          # Add MANAGE_EXTERNAL_STORAGE permission
          # -----------------------------------------

          sed -i '/<application/i\
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' \
            android/app/src/main/AndroidManifest.xml

          # -----------------------------------------
          # Create StorageAccessPlugin.java
          # -----------------------------------------

          cat > android/app/src/main/java/com/pestco/app/StorageAccessPlugin.java <<'EOF'
          package com.pestco.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "StorageAccess")
          public class StorageAccessPlugin extends Plugin {

              @com.getcapacitor.PluginMethod
              public void checkAllFilesAccess(PluginCall call) {

                  boolean granted;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      granted = Environment.isExternalStorageManager();
                  } else {
                      granted = true;
                  }

                  JSObject ret = new JSObject();
                  ret.put("granted", granted);

                  call.resolve(ret);
              }

              @com.getcapacitor.PluginMethod
              public void requestAllFilesAccess(PluginCall call) {

                  try {

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {

                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION
                          );

                          intent.setData(
                              Uri.parse(
                                  "package:" + getContext().getPackageName()
                              )
                          );

                          getActivity().startActivity(intent);
                      }

                      call.resolve();

                  } catch (Exception e) {

                      try {

                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION
                          );

                          getActivity().startActivity(intent);

                          call.resolve();

                      } catch (Exception e2) {

                          call.reject(
                              "Unable to open storage access settings",
                              e2
                          );
                      }
                  }
              }
          }
          EOF

          # -----------------------------------------
          # Register plugin in MainActivity
          # -----------------------------------------

          cat > android/app/src/main/java/com/pestco/app/MainActivity.java <<'EOF'
          package com.pestco.app;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StorageAccessPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          echo "======================================"
          echo "Android storage access setup complete"
          echo "======================================"

      # =========================
      # Generate Icons
      # =========================
      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android

      # =========================
      # Capacitor Sync
      # =========================
      - name: Sync Capacitor
        run: npx cap sync android

      # =========================
      # Verify Storage Permission
      # =========================
      - name: Verify Android storage setup
        run: |
          echo "===== MANIFEST ====="
          grep -n "MANAGE_EXTERNAL_STORAGE" \
            android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "===== STORAGE PLUGIN ====="
          test -f \
            android/app/src/main/java/com/pestco/app/StorageAccessPlugin.java \
            && echo "StorageAccessPlugin.java OK" \
            || echo "StorageAccessPlugin.java MISSING"

          echo ""
          echo "===== MAIN ACTIVITY ====="
          cat android/app/src/main/java/com/pestco/app/MainActivity.java

      # =========================
      # Gradle permission
      # =========================
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # =========================
      # Build APK
      # =========================
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # =========================
      # Upload APK
      # =========================
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pestco-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # =========================
      # GitHub Release
      # =========================
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
