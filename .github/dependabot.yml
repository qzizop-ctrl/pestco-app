version: 2
updates:
  # npm packages (react, firebase, electron, capacitor, dev tooling...).
  # xlsx is installed from a direct CDN .tgz URL rather than the npm
  # registry (see package.json), so Dependabot can't version-check it —
  # that one has to be updated manually by watching
  # https://cdn.sheetjs.com/ or https://git.sheetjs.com/sheetjs/sheetjs
  # for new releases.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch same-vendor packages into one PR instead of one PR per
      # package, so a Capacitor or Sentry bump doesn't spam ten PRs.
      capacitor:
        patterns:
          - "@capacitor/*"
      sentry:
        patterns:
          - "@sentry/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
    ignore:
      # vite, @vitejs/plugin-react and vitest have to stay on compatible
      # major versions with each other (a solo major bump broke npm
      # install once already — vite 8 vs. a plugin-react still on the
      # v4-v7 peer range). Minor/patch updates auto-PR as normal; a major
      # bump needs to be done by hand for all three together, after
      # checking they actually support each other.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # Same problem, same fix: eslint 10 broke npm install because
      # eslint-plugin-react@7.37.5 only accepts eslint ^3-^9.7. The whole
      # eslint + eslint-plugin-* + @eslint/js family needs to move
      # together on a major bump, done by hand.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-prettier"
        update-types: ["version-update:semver-major"]

  # The GitHub Actions used in .github/workflows/ (actions/checkout,
  # actions/setup-node, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
