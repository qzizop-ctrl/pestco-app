version: 2
updates:
  # npm packages (react, firebase, electron, capacitor, dev tooling...).
  # xlsx is installed from a direct CDN .tgz URL rather than the npm
  # registry (see package.json), so Dependabot can't version-check it —
  # that one has to be updated manually by watching
  # https://cdn.sheetjs.com/ or https://git.sheetjs.com/sheetjs/sheetjs
  # for new releases.
  #
  # Policy (changed): minor and patch updates are now allowed. The old
  # "patch only" rule blocked every minor/major bump, so security fixes
  # shipped in newer lines (Electron is supported for only ~6 months per
  # major, jsPDF fixed several CVEs in 4.x) never arrived on their own.
  # Safety now comes from CI (lint + tests must pass on every PR) and from
  # grouping, not from blocking updates:
  #   - minor + patch of everything else -> ONE weekly PR
  #   - every major -> its own PR, so it can be reviewed and tested alone
  #   - Capacitor majors also need a native android/ migration
  #     (npx cap migrate) — never merge those PRs without doing it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"
      sentry:
        patterns:
          - "@sentry/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
      # Electron + its packaging/updating tools move together.
      electron:
        patterns:
          - "electron"
          - "electron-builder"
          - "electron-updater"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@capacitor/*"
          - "electron"
          - "electron-*"
    ignore:
      # lucide-react is 0.x, so a "minor" bump can rename/remove icons
      # (0.383.0 -> 0.577.0 broke the build once). Upgrade it by hand.
      - dependency-name: "lucide-react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # The GitHub Actions used in .github/workflows/ (actions/checkout,
  # actions/setup-node, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
